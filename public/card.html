<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Family Three share card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/card.css">
</head>
<body>
<main class="card" id="card">
  <section class="card-left">
    <div class="brand"><svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="15" cy="5" r="3"/><circle cx="6" cy="25" r="3"/><circle cx="15" cy="25" r="3"/><circle cx="24" cy="25" r="3"/><path d="M15 8v8M6 22v-6h18v6M15 16v6"/></svg><span>Family Three</span></div>
    <p class="card-kicker">I didn’t prompt this app. I raised it.</p>
    <h1 id="title"></h1>
    <p class="card-stats" id="stats"></p>
    <div class="tchips" id="likes"></div>
    <p class="card-foot">Three working apps per generation, built at once on a Fly.io Sprite. Breed one, cross two, adopt the keeper.</p>
  </section>
  <section class="card-right"><div class="card-tree" id="tree"></div></section>
</main>
<script type="module" src="/card.js"></script>
</body>
</html>
